[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soctool"
version = "0.1.0"
description = "Command-line and local web toolkit for SOC analysts: log hunting, phishing triage, IOC enrichment and decoding."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["soc", "security", "threat-hunting", "dfir", "phishing", "ioc", "mitre-attack", "blue-team"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
soc = "soctool.cli:main"

[tool.setuptools.packages.find]
include = ["soctool*"]

[tool.setuptools.package-data]
"soctool.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
